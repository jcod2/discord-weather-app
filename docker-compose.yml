services:
  dashboard:
    build: .
    container_name: weather-dashboard
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - db-data:/app/data
    environment:
      - DB_PATH=/app/data/history.db
    restart: unless-stopped

  updater:
    build: .
    container_name: weather-updater
    env_file:
      - .env
    volumes:
      - db-data:/app/data
    environment:
      - DB_PATH=/app/data/history.db
    command: >
      sh -c "while true; do uv run update_icon.py; sleep 3600; done"
    restart: unless-stopped

volumes:
  db-data: